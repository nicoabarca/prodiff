[package]
name = "prodiff"
version = "0.2.1"
description = "ProDiff"
authors = ["you"]
edition = "2021"
default-run = "prodiff"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prodiff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
polars = { version = "0.54.4", features = ["csv", "parquet", "lazy", "dtype-date", "dtype-datetime", "strings", "cum_agg", "is_in"] }
statrs = "0.19.0"
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]
